<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/estilos.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>

    <title>Fundacion Huellas del Puerto</title>
</head>

<body class="body">
    <head>
        <!-- Logo Perros -->
         <div class="text-center">
            <img src="image/Logo (1).png" alt="Logo Fundacion" id="logo">
        </div>
        <!-- Barra de navegacion -->
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto justify-content-center">
                <li class="nav-item">
                <a class="nav-link" aria-current="page" href="index.html">Inicio</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="galeria.html">Mascotas</a>
                </li>
                <li class="nav-item">
                <a class="nav-link active" href="adopcion.html">Adoptar</a>
                </li>
            </ul>
            </div>
        </div>
        </nav>
    </head>

    <!-- Formulario Adopcion -->
    <main class="container-fluid mt-5">
    <h2 class="text-center mb-4">Formulario de Solicitud de Adopción</h2>
    
    <section class="row justify-content-center">
        <div class="col-md-8">
            <!-- Form envuelve todo para el formulario -->
            <form action="#" method="POST" class="p-4 border rounded shadow-sm bg-light">
                
                <!-- Nombre Completo -->
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre completo:</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                </div>

                <!-- Correo y Teléfono -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Correo electrónico:</label>
                        <!-- type="email" valida automáticamente que tenga un @ -->
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="telefono" class="form-label">Teléfono:</label>
                        <input type="tel" class="form-control" id="telefono" name="telefono" required>
                    </div>
                </div>

                <!-- Edad (Mayor de 18) -->
                <div class="mb-3">
                    <label for="edad" class="form-label">Edad (Debe ser mayor de 18 años)</label>
                    <input type="number" class="form-control" id="edad" name="edad" min="18" required> <!-- Formato para que la edad sea mayor a 18 y no permita ingresar un valor menor tipo contador -->
                </div>

                <!-- Mascota de interés y Vivienda (Controles Select) -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="mascota" class="form-label">Mascota de interés</label>
                        <select class="form-select" id="mascota" name="mascota" required>
                            <option value="">Seleccione una opción...</option>
                            <option value="ragnar">Ragnar</option>
                            <option value="jack">Jack</option>
                            <option value="misifu">Misifu</option>
                            <option value="simba">Simba</option>
                            <option value="luna">Luna</option>
                            <option value="max">Max</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="vivienda" class="form-label">Tipo de vivienda</label>
                        <select class="form-select" id="vivienda" name="vivienda" required>
                            <option value="">Seleccione...</option>
                            <option value="casa">Casa</option>
                            <option value="departamento">Departamento</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>
                </div>

                <!-- Boton de si tiene mas mascotas (SI/NO)-->
                <div class="mb-3">
                    <label class="form-label d-block">¿Tiene otras mascotas actualmente?</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="otras_mascotas" id="mascotasSi" value="si" required>
                        <label class="form-check-label" for="mascotasSi">Sí</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="otras_mascotas" id="mascotasNo" value="no" required>
                        <label class="form-check-label" for="mascotasNo">No</label>
                    </div>
                </div>

                <!-- Descripcion del motivo de adopcion -->
                <div class="mb-3">
                    <label for="motivo" class="form-label">Motivo de la adopción o comentarios</label>
                    <textarea class="form-control" id="motivo" name="motivo" rows="3" required></textarea>
                </div>

                <!-- Checkbox de compromiso -->
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="compromiso" required>
                    <label class="form-check-label" for="compromiso">Acepto el compromiso de tenencia responsable</label>
                </div>

                <!-- Botón de envío -->
                <button type="submit" class="btn btn-primary w-100">Enviar Solicitud</button>
            </form>
        </div>
    </section>
    </main>

    <!-- Footer Final de informacion de contacto -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p>Contacto: contacto@huellasdelpuerto.cl | Teléfono: +56 9 1234 5678</p>
        <p>Ubicación: Cerro Alegre, Valparaíso | Horario de visitas: Lun a Sab, 10:00 - 18:00 hrs.</p>
        <div>
            <i class="bi bi-envelope"></i>
            <i class="bi bi-instagram"></i>
            <i class="bi bi-whatsapp"></i>
            <i class="bi bi-telephone"></i>
        </div>
    </footer>
